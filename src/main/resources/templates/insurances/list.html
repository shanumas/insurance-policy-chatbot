<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Alla Försäkringar')"></head>
<body>
<div th:replace="fragments/header :: navbar('insurances')"></div>

<div class="container main-content">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Alla <span class="highlight">Försäkringar</span></h2>
            <a href="/admin/insurances/new" class="btn">Skapa ny</a>
        </div>

        <div th:if="${insurances.isEmpty()}" class="empty-state">
            <p>Inga försäkringar hittades. Skapa din första försäkring för att komma igång!</p>
            <a href="/admin/insurances/new" class="btn" style="margin-top: 1rem;">Skapa försäkring</a>
        </div>

        <table th:if="${!insurances.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Kundnamn</th>
                    <th>Personnummer</th>
                    <th>Försäkringstyp</th>
                    <th>Policyer</th>
                    <th>Nuvarande Adress</th>
                    <th>Åtgärder</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="insurance : ${insurances}">
                    <td th:text="${insurance.id}">1</td>
                    <td th:text="${insurance.customerName}">Anna Andersson</td>
                    <td th:text="${insurance.personalNumber}">199001011234</td>
                    <td>
                        <span class="badge"
                              th:classappend="${insurance.policyType == T(com.hedvig.policies.domain.PolicyType).BAS} ? 'badge-info' : (${insurance.policyType == T(com.hedvig.policies.domain.PolicyType).STANDARD} ? 'badge-success' : 'badge-warning')"
                              th:text="${insurance.policyType}">STANDARD</span>
                    </td>
                    <td>
                        <span class="badge badge-info" th:text="${insurance.policies.size()} + ' version(s)'">1 version(s)</span>
                    </td>
                    <td>
                        <span th:if="${!insurance.policies.isEmpty()}"
                              th:text="${insurance.policies[0].address}">Kungsgatan 16</span>
                        <span th:if="${insurance.policies.isEmpty()}" style="color: #999;">-</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/insurances/{id}(id=${insurance.id})}"
                           class="btn btn-secondary"
                           style="padding: 0.5rem 1rem; font-size: 0.875rem;">Visa detaljer</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Chat Widget -->
<div th:replace="fragments/chat-widget :: chatWidget"></div>

</body>
</html>
