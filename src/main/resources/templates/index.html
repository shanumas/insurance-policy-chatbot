<!DOCTYPE html>

<head th:replace="fragments/header :: head('Hem')"></head>
<body>
<div th:replace="fragments/header :: navbar('home')"></div>

<div class="container main-content">
    <div class="card">
        <h1>Välkommen till <span class="highlight">Hedvig</span> Policy Manager</h1>
        <p style="font-size: 1.125rem; margin-bottom: 3rem;">
            Hantera försäkringar för bostadsrätt enkelt och smidigt.
        </p>

        <div class="feature-grid">
            <div class="feature-card">
                <h3>📋 Visa försäkringar</h3>
                <p>
                    Bläddra bland alla försäkringsavtal och deras olika versioner.
                </p>
                <a href="/admin/insurances" class="btn">Visa alla</a>
            </div>

            <div class="feature-card">
                <h3>➕ Skapa ny försäkring</h3>
                <p>
                    Starta ett nytt försäkringsavtal för en kund.
                </p>
                <a href="/admin/insurances/new" class="btn">Skapa försäkring</a>
            </div>
        </div>
    </div>
</div>

<!-- Chat Widget -->
<div th:replace="fragments/chat-widget :: chatWidget"></div>

</html>
