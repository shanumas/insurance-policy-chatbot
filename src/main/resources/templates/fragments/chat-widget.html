<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="chatWidget">
    <!-- Chat Widget Container -->
    <div id="chatWidget" class="chat-widget-container">
        <div class="chat-widget-header">
            <div>
                <h3>Hedvig Assistent</h3>
                <p class="chat-status">Online</p>
            </div>
            <button class="chat-close-btn" onclick="toggleChatWidget()">✕</button>
        </div>

        <div class="chat-widget-messages" id="chatWidgetMessages">
            <div class="chat-welcome-message">
                <div class="chat-avatar-assistant">AI</div>
                <div class="chat-message-bubble assistant">
                    <p><strong>Hej! Välkommen till Hedvig!</strong></p>
                    <p>Jag kan hjälpa dig med frågor om din hemförsäkring. Vad undrar du över?</p>
                </div>
            </div>

            <div class="chat-suggested-questions">
                <button class="chat-suggestion" onclick="sendSuggestion('Vad täcker min hemförsäkring?')">
                    Vad täcker min hemförsäkring?
                </button>
                <button class="chat-suggestion" onclick="sendSuggestion('Hur gör jag en skadeanmälan?')">
                    Hur gör jag en skadeanmälan?
                </button>
                <button class="chat-suggestion" onclick="sendSuggestion('Vad är självrisk?')">
                    Vad är självrisk?
                </button>
            </div>
        </div>

        <div class="chat-widget-input">
            <textarea
                id="chatWidgetInput"
                placeholder="Skriv ditt meddelande..."
                rows="1"
                onkeydown="handleChatKeyDown(event)"
            ></textarea>
            <button id="chatSendBtn" onclick="sendChatMessage()">
                <span>➤</span>
            </button>
        </div>
    </div>

    <!-- Chat Button -->
    <button id="chatWidgetButton" class="chat-widget-button" onclick="toggleChatWidget()">
        <span class="chat-icon">💬</span>
        <span class="chat-text">Kontakta oss</span>
    </button>

    <style>
        /* Chat Widget Button */
        .chat-widget-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #3498db;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 32px;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.3);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
            z-index: 9998;
            border: none;
            font-size: 1rem;
        }

        .chat-widget-button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .chat-widget-button .chat-icon {
            font-size: 1.25rem;
        }

        /* Chat Widget Container */
        .chat-widget-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        .chat-widget-container.open {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Chat Header */
        .chat-widget-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-widget-header h3 {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 600;
            color: white;
        }

        .chat-status {
            font-size: 0.8125rem;
            opacity: 0.9;
            margin: 0.25rem 0 0 0;
        }

        .chat-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .chat-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Chat Messages */
        .chat-widget-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-message-group {
            display: flex;
            gap: 0.75rem;
            animation: fadeIn 0.3s ease-in;
        }

        .chat-message-group.user {
            flex-direction: row-reverse;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-avatar-user,
        .chat-avatar-assistant {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8125rem;
            flex-shrink: 0;
        }

        .chat-avatar-user {
            background: #3498db;
            color: white;
        }

        .chat-avatar-assistant {
            background: #24d366;
            color: white;
        }

        .chat-message-bubble {
            max-width: 75%;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            font-size: 0.9375rem;
            line-height: 1.5;
        }

        .chat-message-bubble.user {
            background: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message-bubble.assistant {
            background: white;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .chat-message-bubble p {
            margin: 0 0 0.5rem 0;
        }

        .chat-message-bubble p:last-child {
            margin-bottom: 0;
        }

        .chat-welcome-message {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .chat-welcome-message .chat-message-bubble {
            max-width: 100%;
        }

        /* Suggested Questions */
        .chat-suggested-questions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .chat-suggestion {
            background: white;
            border: 2px solid #e8e8e8;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            color: #1a1a1a;
        }

        .chat-suggestion:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }

        /* Typing Indicator */
        .chat-typing-indicator {
            display: flex;
            gap: 0.75rem;
        }

        .chat-typing-bubble {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .chat-typing-dots {
            display: flex;
            gap: 0.375rem;
        }

        .chat-typing-dots span {
            width: 8px;
            height: 8px;
            background: #24d366;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .chat-typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chat-typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Message Sources */
        .chat-message-sources {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #e8e8e8;
            font-size: 0.8125rem;
        }

        .chat-source-item {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #4a4a4a;
        }

        .chat-source-similarity {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            background: #e8f9f0;
            color: #0f7d3a;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 0.5rem;
            font-size: 0.7rem;
        }

        /* Chat Input */
        .chat-widget-input {
            padding: 1rem;
            background: white;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .chat-widget-input textarea {
            flex: 1;
            border: 1px solid #d8d8d8;
            border-radius: 20px;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            outline: none;
        }

        .chat-widget-input textarea:focus {
            border-color: #3498db;
        }

        .chat-widget-input button {
            background: #3498db;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .chat-widget-input button:hover:not(:disabled) {
            background: #2980b9;
            transform: scale(1.05);
        }

        .chat-widget-input button:disabled {
            background: #d8d8d8;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chat-widget-container {
                width: calc(100vw - 32px);
                height: calc(100vh - 100px);
                bottom: 16px;
                right: 16px;
            }

            .chat-widget-button .chat-text {
                display: none;
            }
        }
    </style>

    <script>
        let chatConversationId = null;
        let isChatSending = false;

        function toggleChatWidget() {
            const widget = document.getElementById('chatWidget');
            const button = document.getElementById('chatWidgetButton');

            widget.classList.toggle('open');
            button.style.display = widget.classList.contains('open') ? 'none' : 'flex';

            if (widget.classList.contains('open')) {
                document.getElementById('chatWidgetInput').focus();
            }
        }

        function handleChatKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        }

        function sendSuggestion(text) {
            document.getElementById('chatWidgetInput').value = text;
            sendChatMessage();

            // Hide suggestions after first use
            const suggestions = document.querySelector('.chat-suggested-questions');
            if (suggestions) {
                suggestions.style.display = 'none';
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatWidgetInput');
            const message = input.value.trim();

            if (!message || isChatSending) return;

            // Add user message
            addChatMessage(message, 'user');

            // Clear input
            input.value = '';
            input.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            isChatSending = true;
            document.getElementById('chatSendBtn').disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        conversationId: chatConversationId
                    })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                chatConversationId = data.conversationId;

                // Hide typing indicator
                hideTypingIndicator();

                // Add assistant message
                addChatMessage(data.message, 'assistant', data.sources);

            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                addChatMessage('Jag kunde tyvärr inte besvara din fråga. Vänligen försök igen.', 'assistant');
            } finally {
                isChatSending = false;
                document.getElementById('chatSendBtn').disabled = false;
                input.focus();
            }
        }

        function addChatMessage(text, sender, sources = []) {
            const messagesContainer = document.getElementById('chatWidgetMessages');
            const messageGroup = document.createElement('div');
            messageGroup.className = `chat-message-group ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = sender === 'user' ? 'chat-avatar-user' : 'chat-avatar-assistant';
            avatar.textContent = sender === 'user' ? 'DU' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `chat-message-bubble ${sender}`;

            const textPara = document.createElement('p');
            textPara.textContent = text;
            bubble.appendChild(textPara);

            // Add sources if available
            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'chat-message-sources';
                sourcesDiv.innerHTML = '<strong>Källor:</strong>';

                sources.forEach((source, index) => {
                    const sourceItem = document.createElement('div');
                    sourceItem.className = 'chat-source-item';
                    sourceItem.innerHTML = `
                        <strong>${index + 1}.</strong> ${source.preview}
                        <span class="chat-source-similarity">${(source.similarity * 100).toFixed(0)}%</span>
                    `;
                    sourcesDiv.appendChild(sourceItem);
                });

                bubble.appendChild(sourcesDiv);
            }

            messageGroup.appendChild(avatar);
            messageGroup.appendChild(bubble);
            messagesContainer.appendChild(messageGroup);

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatWidgetMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'chat-typing-indicator';
            typingDiv.id = 'chatTypingIndicator';

            typingDiv.innerHTML = `
                <div class="chat-avatar-assistant">AI</div>
                <div class="chat-typing-bubble">
                    <div class="chat-typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('chatTypingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Auto-resize textarea
        document.addEventListener('DOMContentLoaded', function() {
            const textarea = document.getElementById('chatWidgetInput');
            if (textarea) {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
                });
            }
        });
    </script>
</div>

</html>
